# Solo sviluppo locale: espone Postgres/Redis su loopback con porte libere
# (la 5432/6379 sull'host sono occupate da altri progetti).
# Su VPS prod questo file NON va copiato: DB resta isolato nella rete interna.
services:
  db:
    ports:
      - "5434:5432"
  redis:
    ports:
      - "6380:6379"
