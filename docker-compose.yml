services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [front]
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./uploads:/app/public/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [front, back]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [back]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [back]

  # Migrazioni DB: usa lo stage con la CLI Prisma (l'immagine runtime standalone non la contiene).
  # Avvio manuale: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrate
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    networks: [back]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["migrate"]

  # Strumenti da riga di comando (copie esterne, verifiche): usa lo stage con tutto il progetto.
  # Sul VPS Node non è installato sull'host, quindi questi script girano qui dentro:
  #   docker compose run --rm -T tools node scripts/backup-ftp.mjs /app/backups
  tools:
    build:
      context: .
      target: build
    env_file: [.env]
    volumes:
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    networks: [back]
    profiles: ["tools"]

  backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
    networks: [back]
    depends_on: [db]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  front:
  # NB: 'back' volutamente NON internal: con internal:true Docker Desktop
  # non pubblica le porte dell'override locale. Isolamento garantito dal fatto
  # che il compose base non pubblica alcuna porta di db/redis (solo caddy 80/443).
  back:
